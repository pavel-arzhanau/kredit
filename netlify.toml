# Страница открывается с корня сайта. Пароль правок проверяет функция, в страницу он не вписан.

[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/kredit/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/kredit"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/guan"
  to = "/"
  status = 301

[[redirects]]
  from = "/guan/"
  to = "/"
  status = 301

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
